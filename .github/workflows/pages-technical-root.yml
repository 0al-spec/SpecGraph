name: Deploy DocC Technical Surface

on:
  release:
    # Stable publication, including promotion of a prerelease to stable.
    types: [released]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build DocC technical surface
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify technical root source
        run: |
          test -f docs/github-pages-root/index.html || {
            echo "docs/github-pages-root/index.html is missing."
            exit 1
          }

      - name: Build DocC documentation
        run: |
          swift package --allow-writing-to-directory ./.docc-build \
            generate-documentation \
            --target SpecGraph \
            --output-path ./.docc-build \
            --transform-for-static-hosting \
            --hosting-base-path SpecGraph

      - name: Add technical root
        run: |
          cp docs/github-pages-root/index.html ./.docc-build/index.html

      - name: Record release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'release_tag=%s\nsource_revision=%s\n' "$RELEASE_TAG" "$GITHUB_SHA" \
            > ./.docc-build/release-source.txt

      - name: Verify Pages artifact
        run: |
          test -f ./.docc-build/index.html
          test -f ./.docc-build/documentation/specgraph/index.html
          test -s ./.docc-build/release-source.txt

      - name: Archive DocC artifact
        uses: actions/upload-artifact@v7
        with:
          name: docc-build-pages
          path: ./.docc-build
          include-hidden-files: true

  prepare-pages-artifact:
    name: Prepare case-sensitive redirect artifact
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download DocC artifact
        uses: actions/download-artifact@v8
        with:
          name: docc-build-pages
          path: ./.docc-build

      - name: Add mixed-case DocC compatibility redirect
        run: |
          mkdir -p ./.docc-build/documentation/SpecGraph
          cat > ./.docc-build/documentation/SpecGraph/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=../specgraph/" />
              <link rel="canonical" href="../specgraph/" />
              <title>SpecGraph documentation</title>
            </head>
            <body>
              <p>
                Redirecting to
                <a href="../specgraph/">SpecGraph DocC documentation</a>.
              </p>
            </body>
          </html>
          HTML

      - name: Verify Pages artifact
        run: |
          test -f ./.docc-build/index.html
          test -f ./.docc-build/documentation/specgraph/index.html
          test -f ./.docc-build/documentation/SpecGraph/index.html
          test -s ./.docc-build/release-source.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.docc-build
          include-hidden-files: true

  deploy:
    needs: prepare-pages-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
