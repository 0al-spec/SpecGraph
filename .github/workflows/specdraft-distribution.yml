name: SpecDraft distribution

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      PIPX_HOME: ${{ runner.temp }}/specgraph-pipx
      PIPX_BIN_DIR: ${{ runner.temp }}/specgraph-bin
      PIPX_MAN_DIR: ${{ runner.temp }}/specgraph-man
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel through source distribution
        run: |
          python -m pip install build==1.3.0 pipx==1.8.0
          python -m build --outdir "$RUNNER_TEMP/specgraph-dist"
      - name: Install into an isolated tool environment
        run: pipx install "$RUNNER_TEMP"/specgraph-dist/*.whl --python "$(command -v python)"
      - name: Exercise installed commands in a consumer workspace
        run: >-
          python tests/specdraft_distribution_smoke.py
          --command "$PIPX_BIN_DIR/specgraph"
          --python "$PIPX_HOME/venvs/specgraph/bin/python"
          --wheel "$RUNNER_TEMP"/specgraph-dist/*.whl
          --project "$RUNNER_TEMP/consumer-project"
          --forbidden-source-root "$GITHUB_WORKSPACE"
          --source-revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/specgraph-installation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: specdraft-distribution-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/specgraph-dist/*
            ${{ runner.temp }}/specgraph-installation.json
