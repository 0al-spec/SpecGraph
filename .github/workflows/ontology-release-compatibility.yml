name: Ontology release compatibility

on:
  workflow_dispatch:
  pull_request:
    # These exact skill copies are covered by wheel/native installation and
    # Markdown checks. Any other changed path retains the full workflow.
    paths-ignore:
      - '.codex/skills/specgraph-project-ontology/SKILL.md'
      - 'src/specgraph/resources/skills/specgraph-project-ontology/SKILL.md'
  push:
    branches: [main, master]
    # These exact skill copies are covered by wheel/native installation and
    # Markdown checks. Any other changed path retains the full workflow.
    paths-ignore:
      - '.codex/skills/specgraph-project-ontology/SKILL.md'
      - 'src/specgraph/resources/skills/specgraph-project-ontology/SKILL.md'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONTOLOGY_RELEASE: 0.12.0
  ONTOLOGY_REVISION: 4c5027b7fe075e80d141e77f576eaa58ca0d3679

jobs:
  compiler-compatibility:
    runs-on: macos-15
    steps:
      - name: Checkout SpecGraph
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned Ontology release source
        uses: actions/checkout@v6
        with:
          repository: 0al-spec/Ontology
          ref: ${{ env.ONTOLOGY_REVISION }}
          path: .ontology-release-source
          persist-credentials: false

      - name: Verify source and Swift toolchain
        run: |
          set -euo pipefail
          test "$(git -C .ontology-release-source rev-parse HEAD)" = "$ONTOLOGY_REVISION"
          for version in 0.1.0 0.2.0; do
            cmp ".ontology-release-source/SPECS/ontology/foundation/$version/model.json" \
              "tools/project_ontology_context/pinned_foundation/model-$version.json"
          done
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install SpecGraph dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test ontology name collision detection
        run: python -m pytest -q tests/test_ontology_name_collisions.py tests/test_ontology_import_name_collisions.py

      - name: Build ontologyc from pinned source
        run: |
          set -euo pipefail
          swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --product ontologyc

      - name: Verify release compiler against the project-local fixture
        run: |
          set -euo pipefail
          compiler_dir="$(swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --show-bin-path)"
          python tools/ontology_release_smoke.py \
            --ontologyc "$compiler_dir/ontologyc" \
            --ontology-source "$GITHUB_WORKSPACE/.ontology-release-source" \
            --work-dir "$RUNNER_TEMP/ontology-release-smoke"
          "$compiler_dir/ontologyc" check specs/models/SG-SPEC-0072/domain-ontology-package.yaml
          "$compiler_dir/ontologyc" export-foundation > "$RUNNER_TEMP/foundation-exports.json"
          cmp "$RUNNER_TEMP/foundation-exports.json" tools/project_ontology_context/pinned_foundation/exports-0.2.0.json
          ONTOLOGYC_BINARY_PATH="$compiler_dir/ontologyc" python -m pytest -q tests/test_project_ontology_foundation.py tests/test_project_ontology_composition.py tests/test_project_ontology_joint_reports.py

      - name: Reproduce the local model diagrams with the released visualizer
        id: model_tools
        env:
          ARCHIVE_SHA256: c9fa61a8fae43b3f934e3ef139ad6045a467d6477febb5a1df73a007dc856063
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/ontology-models.XXXXXXXX")
          bundle="ontologyc-$ONTOLOGY_RELEASE-macos-arm64"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/0al-spec/Ontology/releases/download/$ONTOLOGY_RELEASE/$bundle.tar.gz" \
            --output "$work/archive.tar.gz"
          (cd "$work" && printf '%s  archive.tar.gz\n' "$ARCHIVE_SHA256" | shasum -a 256 -c -)
          tar -xzf "$work/archive.tar.gz" -C "$work" "$bundle/ontologyviz" "$bundle/ontologyc"
          "$work/$bundle/ontologyviz" ontology/packages/specgraph-core/domain-ontology-package.yaml \
            --format json --view full --out "$work/specgraph-core"
          cmp "$work/specgraph-core/ontology.graph.json" ontology/packages/specgraph-core/generated/ontology.graph.json
          published_core=ontology/packages/specgraph-core/versions/0.3.0/domain-ontology-package.yaml
          "$work/$bundle/ontologyviz" "$published_core" \
            --format json --view full --out "$work/specgraph-core-030"
          cmp "$work/specgraph-core-030/ontology.graph.json" ontology/packages/specgraph-core/versions/0.3.0/generated/ontology.graph.json
          "$work/$bundle/ontologyc" compile "$published_core" --target typescript --out "$work/specgraph-core-sdk"
          cmp "$work/specgraph-core-sdk/ontology.normalized.json" ontology/packages/specgraph-core/versions/0.3.0/generated/ontology.normalized.json
          for id in SG-SPEC-0072 SG-SPEC-0071; do
            model="specs/models/$id"
            "$work/$bundle/ontologyviz" "$model/domain-ontology-package.yaml" --format dot --out "$work/$id"
            cmp "$work/$id/ontology.dot" "$model/ontology.dot"
          done
          echo "compiler=$work/$bundle/ontologyc" >> "$GITHUB_OUTPUT"
          echo "visualizer=$work/$bundle/ontologyviz" >> "$GITHUB_OUTPUT"

      - name: Check and export the ontology review overview
        env:
          ONTOLOGYC_BINARY_PATH: ${{ steps.model_tools.outputs.compiler }}
          ONTOLOGYVIZ_BINARY_PATH: ${{ steps.model_tools.outputs.visualizer }}
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_core_ontology_publication.py tests/test_ontology_review_overview.py tests/test_graph_invariant_ontology.py
          "$ONTOLOGYVIZ_BINARY_PATH" \
            --profile specs/models/review/ontology-overview/ontology.profile.json \
            --format json --out "$RUNNER_TEMP/ontology-review-overview"
          cmp "$RUNNER_TEMP/ontology-review-overview/ontology.graph.json" specs/models/review/ontology-overview/generated/ontology.graph.json

      - name: Retain the ontology review overview
        uses: actions/upload-artifact@v4
        with:
          name: ontology-review-overview
          path: ${{ runner.temp }}/ontology-review-overview/ontology.graph.json
          if-no-files-found: error

      - name: Check publication file criteria with their shared SDK and production verifier
        env:
          ONTOLOGYC_BINARY_PATH: ${{ steps.model_tools.outputs.compiler }}
          ONTOLOGYVIZ_BINARY_PATH: ${{ steps.model_tools.outputs.visualizer }}
        run: |
          set -euo pipefail
          toolchain=$(mktemp -d "$RUNNER_TEMP/payload-ts.XXXXXXXX")
          npm install --prefix "$toolchain" --no-audit --no-fund --ignore-scripts typescript@6.0.3 zod@4.4.3
          TYPESCRIPT_TSC_PATH="$toolchain/node_modules/typescript/bin/tsc" \
            python -m pytest -v tests/test_publication_digest_ontology_model.py \
              tests/test_intent_proposal_ontology_model.py \
              tests/test_promotion_ontology_model.py \
              tests/test_ontology_advice_release.py \
              tests/test_ontology_inheritance_release.py \
              tests/test_ontology_protocol_conformance_release.py \
              tests/test_publication_bundle_ontology_model.py \
              tests/test_static_artifact_incremental_stage.py::test_pb_payload_model_against_bundle_verifier \
              tests/test_static_artifact_incremental_stage.py::test_pb_manifest_model_against_bundle_verifier \
              tests/test_static_artifact_incremental_stage.py::test_pb_checksums_model_against_bundle_verifier \
              tests/test_static_artifact_incremental_stage.py::test_pb_missing_model_against_bundle_verifier

      - name: Retain compatibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: ontology-release-compatibility
          path: ${{ runner.temp }}/ontology-release-smoke/receipt.json
          if-no-files-found: error

  compiler-compatibility-linux:
    # Keep the host Python tool cache compatible with the jammy container's glibc.
    runs-on: ubuntu-22.04
    container: swift:6.0.3-jammy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout SpecGraph
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned Ontology release source
        uses: actions/checkout@v6
        with:
          repository: 0al-spec/Ontology
          ref: ${{ env.ONTOLOGY_REVISION }}
          path: .ontology-release-source
          persist-credentials: false

      - name: Verify source and Swift toolchain
        run: |
          set -euo pipefail
          test "$(git -C .ontology-release-source rev-parse HEAD)" = "$ONTOLOGY_REVISION"
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install SpecGraph dependencies
        run: python -m pip install -e '.[dev]'

      - name: Build ontologyc from pinned source
        run: |
          set -euo pipefail
          swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --product ontologyc

      - name: Verify release compiler against the project-local fixture
        run: |
          set -euo pipefail
          compiler_dir="$(swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --show-bin-path)"
          python tools/ontology_release_smoke.py \
            --ontologyc "$compiler_dir/ontologyc" \
            --ontology-source "$GITHUB_WORKSPACE/.ontology-release-source" \
            --work-dir "$RUNNER_TEMP/ontology-release-smoke"
          "$compiler_dir/ontologyc" check specs/models/SG-SPEC-0072/domain-ontology-package.yaml
          "$compiler_dir/ontologyc" export-foundation > "$RUNNER_TEMP/foundation-exports.json"
          cmp "$RUNNER_TEMP/foundation-exports.json" tools/project_ontology_context/pinned_foundation/exports-0.2.0.json
          ONTOLOGYC_BINARY_PATH="$compiler_dir/ontologyc" python -m pytest -q \
            tests/test_project_ontology_foundation.py tests/test_project_ontology_composition.py \
            tests/test_project_ontology_joint_reports.py tests/test_ontology_protocol_conformance_release.py

      - name: Retain compatibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: ontology-release-compatibility-linux
          path: ${{ runner.temp }}/ontology-release-smoke/receipt.json
          if-no-files-found: error
