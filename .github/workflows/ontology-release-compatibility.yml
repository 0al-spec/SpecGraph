name: Ontology release compatibility

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONTOLOGY_RELEASE: 0.5.0
  ONTOLOGY_REVISION: 0fcc94469d971aaf39fcc182bc5c6b8acff37fd2

jobs:
  compiler-compatibility:
    runs-on: macos-15
    steps:
      - name: Checkout SpecGraph
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned Ontology release source
        uses: actions/checkout@v6
        with:
          repository: 0al-spec/Ontology
          ref: ${{ env.ONTOLOGY_REVISION }}
          path: .ontology-release-source
          persist-credentials: false

      - name: Verify source and Swift toolchain
        run: |
          set -euo pipefail
          test "$(git -C .ontology-release-source rev-parse HEAD)" = "$ONTOLOGY_REVISION"
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install SpecGraph dependencies
        run: python -m pip install -e '.[dev]'

      - name: Build ontologyc from pinned source
        run: |
          set -euo pipefail
          swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --product ontologyc

      - name: Verify release compiler against the project-local fixture
        run: |
          set -euo pipefail
          compiler_dir="$(swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --show-bin-path)"
          python tools/ontology_release_smoke.py \
            --ontologyc "$compiler_dir/ontologyc" \
            --ontology-source "$GITHUB_WORKSPACE/.ontology-release-source" \
            --work-dir "$RUNNER_TEMP/ontology-release-smoke"
          "$compiler_dir/ontologyc" check specs/models/SG-SPEC-0072/domain-ontology-package.yaml
          "$compiler_dir/ontologyc" export-foundation > "$RUNNER_TEMP/foundation-exports.json"
          cmp "$RUNNER_TEMP/foundation-exports.json" tools/project_ontology_context/pinned_foundation/exports.json
          ONTOLOGYC_BINARY_PATH="$compiler_dir/ontologyc" python -m pytest -q tests/test_project_ontology_foundation.py

      - name: Reproduce the local model diagrams with the released visualizer
        id: model_tools
        env:
          ARCHIVE_SHA256: 83d99b865b0979450a47998438eb1ff07229f2142e0658d8acd24765b69a2079
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/ontology-models.XXXXXXXX")
          bundle="ontologyc-$ONTOLOGY_RELEASE-macos-arm64"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/0al-spec/Ontology/releases/download/$ONTOLOGY_RELEASE/$bundle.tar.gz" \
            --output "$work/archive.tar.gz"
          (cd "$work" && printf '%s  archive.tar.gz\n' "$ARCHIVE_SHA256" | shasum -a 256 -c -)
          tar -xzf "$work/archive.tar.gz" -C "$work" "$bundle/ontologyviz" "$bundle/ontologyc"
          for id in SG-SPEC-0072 SG-SPEC-0071; do
            model="specs/models/$id"
            "$work/$bundle/ontologyviz" "$model/domain-ontology-package.yaml" --format dot --out "$work/$id"
            cmp "$work/$id/ontology.dot" "$model/ontology.dot"
          done
          echo "compiler=$work/$bundle/ontologyc" >> "$GITHUB_OUTPUT"

      - name: Check PB-PAYLOAD and PB-MANIFEST with their shared SDK and production verifier
        env:
          ONTOLOGYC_BINARY_PATH: ${{ steps.model_tools.outputs.compiler }}
        run: |
          set -euo pipefail
          toolchain=$(mktemp -d "$RUNNER_TEMP/payload-ts.XXXXXXXX")
          npm install --prefix "$toolchain" --no-audit --no-fund --ignore-scripts typescript@6.0.3
          TYPESCRIPT_TSC_PATH="$toolchain/node_modules/typescript/bin/tsc" \
            python -m pytest -v tests/test_publication_digest_ontology_model.py \
              tests/test_static_artifact_incremental_stage.py::test_pb_payload_model_against_bundle_verifier \
              tests/test_static_artifact_incremental_stage.py::test_pb_manifest_model_against_bundle_verifier

      - name: Retain compatibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: ontology-release-compatibility
          path: ${{ runner.temp }}/ontology-release-smoke/receipt.json
          if-no-files-found: error

  compiler-compatibility-linux:
    # Keep the host Python tool cache compatible with the jammy container's glibc.
    runs-on: ubuntu-22.04
    container: swift:6.0.3-jammy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout SpecGraph
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned Ontology release source
        uses: actions/checkout@v6
        with:
          repository: 0al-spec/Ontology
          ref: ${{ env.ONTOLOGY_REVISION }}
          path: .ontology-release-source
          persist-credentials: false

      - name: Verify source and Swift toolchain
        run: |
          set -euo pipefail
          test "$(git -C .ontology-release-source rev-parse HEAD)" = "$ONTOLOGY_REVISION"
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install SpecGraph dependencies
        run: python -m pip install -e '.[dev]'

      - name: Build ontologyc from pinned source
        run: |
          set -euo pipefail
          swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --product ontologyc

      - name: Verify release compiler against the project-local fixture
        run: |
          set -euo pipefail
          compiler_dir="$(swift build --package-path "$GITHUB_WORKSPACE/.ontology-release-source" \
            --scratch-path "$RUNNER_TEMP/ontology-build" --force-resolved-versions \
            --configuration release --show-bin-path)"
          python tools/ontology_release_smoke.py \
            --ontologyc "$compiler_dir/ontologyc" \
            --ontology-source "$GITHUB_WORKSPACE/.ontology-release-source" \
            --work-dir "$RUNNER_TEMP/ontology-release-smoke"
          "$compiler_dir/ontologyc" check specs/models/SG-SPEC-0072/domain-ontology-package.yaml
          "$compiler_dir/ontologyc" export-foundation > "$RUNNER_TEMP/foundation-exports.json"
          cmp "$RUNNER_TEMP/foundation-exports.json" tools/project_ontology_context/pinned_foundation/exports.json
          ONTOLOGYC_BINARY_PATH="$compiler_dir/ontologyc" python -m pytest -q tests/test_project_ontology_foundation.py

      - name: Retain compatibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: ontology-release-compatibility-linux
          path: ${{ runner.temp }}/ontology-release-smoke/receipt.json
          if-no-files-found: error
