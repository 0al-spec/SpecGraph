name: SpecificationMetrics PR report

on:
  workflow_run:
    workflows: [Python CI]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: none
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.resolve.outputs.pr_numbers }}
      workflow_head_sha: ${{ steps.resolve.outputs.workflow_head_sha }}
    steps:
      - name: Resolve PRs associated with the completed CI head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_numbers="$(gh api --paginate \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.state == "open") | .number' \
            | sort -nu | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          echo "pr_numbers=${pr_numbers}" >> "${GITHUB_OUTPUT}"
          echo "workflow_head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  report:
    needs: resolve
    if: needs.resolve.outputs.pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.resolve.outputs.pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: specificationmetrics-pr-${{ matrix.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pin current PR revisions to the successful CI head
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.workflow_head_sha }}
        run: |
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/specificationmetrics-pull-request.json"
          base_sha="$(jq -r '.base.sha' "${RUNNER_TEMP}/specificationmetrics-pull-request.json")"
          api_head_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/specificationmetrics-pull-request.json")"
          if [ "${api_head_sha}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "is_current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping stale metrics run for PR #${PR_NUMBER}; its head moved after Python CI."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${base_sha}"
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "${base_sha}^{commit}"
          fetched_head="$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")"
          if [ "${fetched_head}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "is_current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping stale metrics run for PR #${PR_NUMBER}; its head moved during setup."
            exit 0
          fi
          echo "is_current=true" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_ENV}"
          echo "head_sha=${fetched_head}" >> "${GITHUB_ENV}"

      - name: Create read-only source snapshots
        if: steps.snapshot.outputs.is_current == 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          mkdir -p "${RUNNER_TEMP}/specificationmetrics"
          git worktree add --detach \
            "${RUNNER_TEMP}/specificationmetrics/before" "${base_sha}"
          git worktree add --detach \
            "${RUNNER_TEMP}/specificationmetrics/after" "${head_sha}"

      - name: Apply the trusted metric contract to both snapshots
        if: steps.snapshot.outputs.is_current == 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          for tree in before after; do
            mkdir -p "${RUNNER_TEMP}/specificationmetrics/${tree}/scopes"
            cp .specificationmetrics.toml \
              "${RUNNER_TEMP}/specificationmetrics/${tree}/.specificationmetrics.toml"
            cp scopes/specificationmetrics.toml \
              "${RUNNER_TEMP}/specificationmetrics/${tree}/scopes/specificationmetrics.toml"
          done

      - name: Set up Rust
        if: steps.snapshot.outputs.is_current == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned SpecificationMetrics CLI
        if: steps.snapshot.outputs.is_current == 'true'
        run: >
          cargo install --locked
          --git https://github.com/SoundBlaster/SpecificationMetrics.git
          --rev 332348dc86ebd9cfc9d1db15c37afbae9c2546d0
          --root "${RUNNER_TEMP}/specificationmetrics/cli"
          specification-metrics

      - name: Set up Python metric tools
        if: steps.snapshot.outputs.is_current == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python metrics
        if: steps.snapshot.outputs.is_current == 'true'
        run: python -m pip install -r tools/requirements-metrics.txt

      - name: Set up Node for pinned jscpd
        if: steps.snapshot.outputs.is_current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect base and PR metrics
        if: steps.snapshot.outputs.is_current == 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          PR_NUMBER: ${{ matrix.pr_number }}
          REPOSITORY: ${{ github.repository }}
          COLLECTION_RUN_ID: ${{ github.run_id }}
          COLLECTION_ATTEMPT: ${{ github.run_attempt }}
          UPSTREAM_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          cli="${RUNNER_TEMP}/specificationmetrics/cli/bin/specification-metrics"
          before="${RUNNER_TEMP}/specificationmetrics/before"
          after="${RUNNER_TEMP}/specificationmetrics/after"
          cp .specificationmetrics.toml "${RUNNER_TEMP}/specificationmetrics/collection-config.toml"
          cp scopes/specificationmetrics.toml "${RUNNER_TEMP}/specificationmetrics/scope-manifest.toml"
          jq -n --arg repository "$REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg base "$base_sha" --arg head "$head_sha" \
            --arg run "$COLLECTION_RUN_ID" --arg attempt "$COLLECTION_ATTEMPT" \
            --arg ci "$UPSTREAM_CI_RUN_ID" --arg workflow "$(git rev-parse HEAD)" \
            '{schema_version: 1, repository: $repository, pr_number: ($pr | tonumber),
              base_sha: $base, head_sha: $head, collection_run_id: $run,
              collection_attempt: $attempt, upstream_ci_run_id: $ci,
              trusted_workflow_sha: $workflow,
              analyzer_sha: "332348dc86ebd9cfc9d1db15c37afbae9c2546d0"}' \
            > "${RUNNER_TEMP}/specificationmetrics/provenance.json"
          "${cli}" collect --candidate-locations --config "${before}/.specificationmetrics.toml" \
            --output "${RUNNER_TEMP}/specificationmetrics/before.json"
          "${cli}" collect --candidate-locations --config "${after}/.specificationmetrics.toml" \
            --output "${RUNNER_TEMP}/specificationmetrics/after.json"
          "${cli}" compare "${RUNNER_TEMP}/specificationmetrics/before.json" \
            "${RUNNER_TEMP}/specificationmetrics/after.json" \
            --output "${RUNNER_TEMP}/specificationmetrics/diff.json"

      - name: Retain detailed metric evidence
        id: evidence
        if: always() && steps.snapshot.outputs.is_current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: specificationmetrics-pr-${{ matrix.pr_number }}-${{ env.head_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/specificationmetrics/before.json
            ${{ runner.temp }}/specificationmetrics/after.json
            ${{ runner.temp }}/specificationmetrics/diff.json
            ${{ runner.temp }}/specificationmetrics/provenance.json
            ${{ runner.temp }}/specificationmetrics/collection-config.toml
            ${{ runner.temp }}/specificationmetrics/scope-manifest.toml
          if-no-files-found: warn
          retention-days: 30

      - name: Render the PR metrics comment
        if: success() && steps.snapshot.outputs.is_current == 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          COLLECTION_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          report_dir="${RUNNER_TEMP}/specificationmetrics"
          "${report_dir}/cli/bin/specification-metrics" compare \
            "${report_dir}/before.json" "${report_dir}/after.json" \
            --github-markdown "$REPOSITORY" --output "${report_dir}/locations.md"
          python tools/specificationmetrics_pr_comment.py \
            --before "${RUNNER_TEMP}/specificationmetrics/before.json" \
            --after "${RUNNER_TEMP}/specificationmetrics/after.json" \
            --diff "${RUNNER_TEMP}/specificationmetrics/diff.json" \
            --output "${report_dir}/summary.json" \
            --run-url "https://github.com/${REPOSITORY}/actions/runs/${COLLECTION_RUN_ID}" \
            --artifact-url "$ARTIFACT_URL"
          jq --rawfile locations "${report_dir}/locations.md" \
            '.body += ("\n\n" + $locations)' "${report_dir}/summary.json" > "${report_dir}/comment.json"

      - name: Update the single PR metrics comment
        if: steps.snapshot.outputs.is_current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          existing_id="$(gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- specificationmetrics-pr-report-v1 -->"))) | .id' \
            | sed -n '1p')"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${existing_id}" \
              --input "${RUNNER_TEMP}/specificationmetrics/comment.json" >/dev/null
          else
            gh api --method POST \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "${RUNNER_TEMP}/specificationmetrics/comment.json" >/dev/null
          fi
