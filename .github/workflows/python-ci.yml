name: Python CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  registered-rule-reuse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RULE_BASE: ${{ github.event.pull_request.base.sha }}
      RULE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR snapshots
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout pinned rule analyzer
        uses: actions/checkout@v6
        with:
          repository: SoundBlaster/SpecificationMetrics
          ref: 797dc648e62a14a208cf058af32a996de44cdc91
          path: .rule-reuse-analyzer
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned analyzer with locked dependencies
        run: cargo build --locked --manifest-path .rule-reuse-analyzer/Cargo.toml

      - name: Check registered rule reuse using the base catalog
        env:
          RULE_OUTPUT: ${{ runner.temp }}/registered-rule-reuse
        run: |
          bash tools/check_rule_reuse.sh "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/.rule-reuse-analyzer/target/debug/specification-metrics" \
            "$RULE_BASE" "$RULE_HEAD" "$RULE_OUTPUT"
          cat "$RULE_OUTPUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run-local rule reuse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-rule-reuse
          path: ${{ runner.temp }}/registered-rule-reuse/
          if-no-files-found: warn

  publication-diagnostic-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Check publication diagnostics across supported Python versions
        run: |
          pytest -q tests/test_publication_policy_diagnostics.py
          python tools/publication_policy_diagnostics.py --summary

  spec-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Check Spec evidence gate
        run: >
          make spec-evidence-gate
          SPEC_EVIDENCE_BASE_REF="${{ github.event.pull_request.base.sha }}"
          SPEC_EVIDENCE_HEAD_REF="${{ github.event.pull_request.head.sha }}"

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run blocking Python and spec YAML quality checks
        run: python tools/python_quality.py

      - name: Report lifecycle state classification delta
        if: github.event_name == 'pull_request'
        run: >
          python tools/lifecycle_architecture.py
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Check proposal tracking gate
        run: make proposal-tracking-gate

      - name: Check DocC documentation sync
        run: make docc-sync

      - name: Check pending materialization review packet integrity
        run: make materialization-packet-check

      - name: Publication policy diagnostics (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >
          python tools/publication_policy_diagnostics.py
          --revision "${{ github.event.pull_request.head.sha }}"
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --summary
          --output "${{ runner.temp }}/publication-policy-diagnostics.json"

      - name: Upload publication policy diagnostics
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: publication-policy-diagnostics
          path: ${{ runner.temp }}/publication-policy-diagnostics.json
          if-no-files-found: warn

      - name: Run tests
        run: pytest -q
