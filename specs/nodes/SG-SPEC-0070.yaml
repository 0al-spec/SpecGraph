acceptance:
- Defines one shared native BDD declaration model with exact nonempty string IDs, an optional descriptive
  title, and a nonempty ordered list of nonempty string steps; it preserves step repetition and source
  text without inferring executable grammar.
- Defines typed presence outcomes (`absent`, `explicit_empty`, `present`, `invalid`) and typed findings
  for the native input matrix, with duplicate YAML keys rejected before ordinary map construction and
  invalid declarations barred from successful handoff.
- Resolves `observability.obligations[*].scenario_ids` against the owning node's native scenario IDs and
  keeps this node-local check distinct from optional explicitly bound workspace inventory and its immutable
  workspace identity.
- Records observed 0047 compatibility separately from proposed strict-profile behavior; strict behavior
  requires reviewed field allowlist and extension policy, corpus audit, explicit profile activation, and
  recorded profile/version, without changing current defaults or source bytes.
- Requires named SpecificationCore policy materialization with stable rule references and observable typed
  findings; separates declaration validation from readiness, execution, evidence admission, and any normalized
  digest whose byte contract remains an explicit review prerequisite.
