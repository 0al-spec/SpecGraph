  wording, order, and scenarios.
- Defines per-identity revision chains and independent subject relations and disposition without changing
  frozen SG-SPEC-0019 topology.
- Defines exact identity and revision lookup with explicit unresolved states and criterion-keyed evidence.
- Defines backward-compatible preparation from existing candidate IDs with reviewed migration and no identity
  allocation on ordinary reads.
