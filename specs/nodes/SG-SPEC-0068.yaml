  scope:
    in:
    - Stable Requirement and criterion subject identity and workspace scope
    - Per-subject revision lineage, provenance, and retained containment
    - Typed subject transitions, relation endpoints, and disposition
    - Exact/current lookup, failure outcomes, criterion evidence and legacy compatibility
    out:
    - Storage layout, serialization schema, UUID or URI syntax
    - Allocator implementation and identity declaration physical location
    - Automatic migration, writer changes, or removal of legacy support
    - Runtime implementation or conformance claims
    - Hypercode binding, new seed node kinds, or changes to frozen SG-SPEC-0019
  parent_compatibility:
    parent: SG-SPEC-0019
    rules:
    - This child supplements subject addressing; it does not broaden the parent revision_subject definition
      or reinterpret canonical node/edge supersession.
    - Frozen canonical subjects cannot change in place; an identity-preserving editorial change or move
      applies only where existing governance permits revision. Frozen canonical node replacement follows
      the parent supersession contract.
    - Each canonical node/edge supersession remains a separate one-to-one event with its cross-identity
      terminal predecessor reference; the successor subject begins its own revision-1 origin.
    - Subject decomposition, composition, replacement, withdrawal or activation alone never changes canonical
      topology presence.
  subject_reference_contract:
    immutable_workspace_identity: A persisted workspace identity that scopes every local subject ID. Mutable
      repository names, slugs, remotes, paths, and display labels are not identity.
    requirement_subject: An existing canonical Requirement node addressed by immutable_workspace_identity
      plus its local Requirement ID. This draft does not create a second embedded Requirement representation.
    criterion_subject: A distinct acceptance-criterion subject addressed by immutable_workspace_identity
      plus a local criterion ID. A criterion is not a Requirement, scenario, list index, or statement
      digest.
    full_subject_reference:
      workspace_identity: required immutable workspace identity
      subject_class: Requirement or criterion
      local_subject_id: workspace-local immutable subject ID
      revision: optional exact positive integer revision; omitted only when the caller explicitly requests
        current revision
    acceptance_criteria_refs: The authored Requirement-to-criterion reference relation from a Requirement
      subject to one or more criterion subjects. It remains distinct from decomposition, composition,
      evidence, and scenario relations.
    acceptance_reference_revision_scope:
    - Each Requirement content revision preserves its own acceptance_criteria_refs collection. Every entry
      pins an exact criterion revision; current selection is not valid in this collection.
    - Adding, removing or repinning an acceptance reference is a governed Requirement content change.
      It requires a new revision, or replacement where the existing normative-change rules require a new
      identity. Previous collections remain immutable and readable through exact Requirement lookup.
    - A criterion revision or containment_move never rewrites Requirement references automatically. Rebinding
      the applicable Requirement requires an explicit new Requirement revision. An intended ownership
      transfer updates both affected Requirements while preserving their old revision collections; storage
      containment alone does not establish or transfer ownership.
  identity_rules:
  - A Requirement subject and a criterion subject have separate identities even when they appear in the
    same canonical specification file.
  - Local subject identity is independent of containing node, file path, list position, title, wording,
    scenario ID, and content digest.
  - Two workspaces may use the same local_subject_id without collision when their immutable_workspace_identity
    values differ.
  - A mutable workspace slug may be accepted only as a display alias or an unambiguous lookup hint; it
    is never the persisted identity.
  - A content digest may identify exact bytes for one revision but must not replace subject identity or
    prove semantic continuity.
  - subject_class validates the referenced record; it does not permit two distinct subjects to share one
    workspace-local ID.
  - Workspace identity is a governed declaration controlled by the workspace authority; readers cannot
    allocate, regenerate or change it. The physical declaration and allocator policy require a separate
    implementation decision.
  - A declared replica dataset preserves exactly one immutable workspace identity. Reusing its dataset
    identity for another workspace is a declaration conflict; all affected workspace scopes fail closed.
  - Ordering of acceptance references, relation endpoints or supplied history records does not determine
    identity. Replica comparison uses their governed facts rather than serialization order.
  revision_contract:
    rules:
    - Every Requirement or criterion subject starts at revision 1 as the origin of that subject identity.
    - Revision 1 has no same-identity predecessor.
    - Every later governed content revision or one-to-one containment move advances the revision by one
      and has exactly one immediately preceding revision in the same subject identity.
    - A revision number is local to one full subject reference and is not shared across Requirement and
      criterion subjects.
    - A substantial normative replacement creates a new subject identity; it does not continue the predecessor
      subject's revision chain.
    - When a canonical Requirement node replacement also requires SG-SPEC-0019 topology supersession,
      that canonical supersession event is separate from the successor subject's revision-1 origin.
    - Decomposition and composition relations do not add revision predecessors and do not join revision
      chains.
    - 'Revision creation is atomic per subject: one next revision and one immediate predecessor are committed
      together; concurrent conflicting successors fail closed rather than overwriting history.'
    - Retained revision records and transition provenance are append-only. Physical record placement and
      persistence mechanics require separate review.
    origin_marker: The first revision record is marked as the subject origin rather than pointing to a
      predecessor.
    same_identity_predecessor: A non-origin revision points only to the previous revision of the same
      full subject reference.
    cross_identity_predecessor: A replacement may cite another subject's terminal revision through a separate
      transition or SG-SPEC-0019 supersession reference, but that citation is not a same-identity predecessor.
  transition_contract:
    subject_transitions:
    - transition: editorial_revision
      effect: Retains the same subject identity, advances that subject's revision by one, and records
        provenance and bounded change scope.
    - transition: containment_move
      effect: Retains the same subject identity, advances its revision by one with the previous same-identity
        revision as predecessor, and records changed containment and provenance; containment is not identity.
    - transition: decomposes_into
      effect: Records one source Requirement-to-Requirement or criterion-to-criterion subject relation
        to two or more resulting subjects without changing participant revisions, disposition, canonical
        lifecycle, or topology presence.
    - transition: composed_from
      effect: Records one resulting Requirement-to-Requirement or criterion-to-criterion subject relation
        to two or more contributing subjects without inferring the reverse of decomposes_into.
    - transition: replacement
      effect: Creates a successor subject identity at revision 1 and records the predecessor subject and
        terminal revision without changing either subject disposition. Activation and withdrawal require
        separate explicit transitions. If the subjects are canonical nodes or explicit canonical edges,
        any active-topology change remains a separate SG-SPEC-0019-compliant one-to-one event.
    - transition: activation
      effect: Explicitly activates an existing subject for its applicable subject-level role with provenance,
        without creating replacement lineage or changing SG-SPEC-0019 canonical presence.
    - transition: withdrawal
      effect: Retires the subject for Requirement-level readiness or dependency satisfaction while preserving
        lookup and lineage. Withdrawal alone does not change SG-SPEC-0019 canonical presence.
    relation_endpoint_rules:
    - decomposes_into endpoints must all be Requirement subjects or all be criterion subjects.
    - composed_from endpoints must all be Requirement subjects or all be criterion subjects.
    - Requirement-to-criterion ownership remains acceptance_criteria_refs and is not valid as a decomposition
      or composition endpoint mix.
    - Every authored relation endpoint carries a full_subject_reference; role or class alone is insufficient.
    - No subject relation silently creates a canonical supersedes edge.
    - Reverse queries enumerate all matching authored records and preserve endpoint roles; they MUST NOT
      infer another relation kind by reversing an edge.
    - Every authored relation retains its immutable source workspace binding and a relation ID unique
      within that workspace. The pair is the relation identity; endpoint workspace and provenance text
      cannot substitute for the source binding. Returned records also retain the supplied dataset identity
      as source provenance, not as a trust proof or a replacement for workspace identity.
  lookup_contract:
    request_minimum:
    - immutable_workspace_identity
    - subject_class
    - local_subject_id
    - exact requested_revision or explicitly separate current-revision operation
    response_minimum:
    - full_subject_reference
    - resolved revision or unresolved state
    - current containment history
    - explicit current_subject_disposition with observation provenance; not historical disposition at
      the selected content revision
    - typed subject relations with endpoint roles, subject classes, and the full_subject_reference of
      every endpoint, including explicit exact or current revision selection
    - source workspace and dataset binding of each authored relation, plus explicit completeness of relation
      enumeration within the supplied snapshot scope
    - acceptance_criteria_refs belonging to the selected Requirement revision, with exact criterion pins
    - applicable SG-SPEC-0019 canonical presence when the subject is a canonical node or explicit canonical
      edge
    unresolved_states:
    - unknown_workspace_identity
    - ambiguous_workspace_slug
    - ambiguous_workspace_identity
    - unknown_subject_id
    - subject_class_mismatch
    - unavailable_revision
    - ambiguous_legacy_acceptance_occurrence
    - ambiguous_legacy_evidence_mapping
    - duplicate_candidate_identity
    - conflicting_candidate_definition
    - conflicting_revision_successor
    forbidden_fallbacks:
    - Do not redirect an unknown subject to a related subject.
    - Do not redirect an unavailable revision to latest unless the request explicitly asked for current
      revision.
    - Do not infer identity from equal text, order, path, scenario ID, or content digest.
    - Do not treat a canonical SG-SPEC-0019 successor as the answer to an exact predecessor lookup.
    workspace_collision: Known independent datasets claiming the same immutable workspace identity fail
      closed as ambiguous_workspace_identity before subject selection. A declared replica of the same
      workspace retains identity; declaration conflicts still fail closed rather than choosing a record.
    retired_subject_lookup: An existing retired subject remains resolved, with its requested revision,
      disposition and lineage. Retirement alone is not an unresolved lookup result.
    relation_enumeration:
      scope: Completeness is relative to the explicitly supplied snapshots, not a claim that all canonical
        history or every external workspace has been supplied.
      source_conflict: If any snapshot in an ambiguous source workspace contains a relation mentioning
        the requested identity, return an incomplete relation result with the conflicting workspace and
        dataset identities. Do not promote disputed relations or silently represent them as absent.
      subject_resolution: A subject may remain resolved independently of incomplete relations. Consumers
        must inspect relation completeness before claiming absence or complete lineage. The CLI returns
        nonzero for incomplete relations even when the selected subject content is available.
      unrelated_conflict: An ambiguous workspace with no supplied relation mentioning the requested identity
        does not by itself make that subject's relation enumeration incomplete.
    disposition_projection:
      exact_revision: Exact/current revision selection determines content and revision-specific containment,
        not an as-of cutoff for independent disposition events.
      current_subject_disposition: Both exact and current lookup return the subject current disposition
        explicitly labelled current, with the observed disposition event reference or origin disposition
        and observation provenance. It may change after activation or withdrawal without changing the
        selected content revision.
      history: Retained authored disposition transitions remain inspectable. Historical as-of disposition
        lookup is outside this slice and MUST NOT be inferred from a content revision alone.
      dependency_evaluation: Requirement dependencies use current subject disposition, independently of
        selected historical content.
  dependency_evaluation_contract:
    retired_requirement: cannot satisfy a Requirement dependency; lookup remains independently resolvable
  evidence_contract:
    criterion_keyed_evidence: Acceptance evidence is keyed to the full criterion reference, not to the
      Requirement ID or a text position.
    revision_pinning: Evidence that asserts behavior for exact wording pins the criterion revision; evidence
      that asserts current semantics must say it targets the current revision.
    legacy_evidence: Evidence without a resolvable criterion reference remains legacy evidence until a
      reviewed migration maps it; ordinary reads do not guess.
  migration_contract:
    legacy_dual_read:
    - Readers accept existing string-valued acceptance criteria as legacy unassigned criterion subjects.
    - Readers accept identified criterion records after review introduces them.
    - During dual-read, duplicate IDs, conflicting definitions, and ambiguous evidence mappings fail closed
      with diagnostics.
    candidate_identity_preservation:
    - Existing candidate graph node IDs and materialized candidate IDs remain candidate identities during
      review.
    - A reviewed migration may map one candidate identity or legacy criterion occurrence to one full subject
      reference.
    - A migration must record the source candidate ID or legacy occurrence, destination full subject reference,
      reviewer authority, and provenance.
    - Ordinary reads must not allocate, remint, or rewrite candidate IDs.
    scenario_boundary: Existing BDD scenario IDs remain scenario identities. They may reference Requirement
      or criterion subjects only through authored reviewable relations.
  examples:
  - name: Containment move
    given: A revisable criterion AC-0031 at revision 2 in REQ-0007.
    when: An authorized containment_move relocates it to REQ-0012.
    then:
    - Identity is unchanged and revision 3 immediately follows revision 2.
    - Exact lookup of revision 2 retains old containment; revision 3 exposes new containment.
  - name: Replacement and activation
    given: One predecessor and a new successor subject.
    when: An authorized replacement records successor revision 1.
    then:
    - Successor has an origin marker, not a same-identity predecessor from the old subject.
    - Participant dispositions are unchanged; activation needs its own explicit transition.
    - Canonical node/edge replacement additionally requires the separate parent-compliant 1:1 supersession
      event.
  - name: Relations return all endpoints
    given: A criterion decomposes_into two criteria; another criterion composed_from two contributors.
    when: Lookup traverses each authored relation kind.
    then:
    - Every endpoint has a full durable reference and directed role.
    - Reverse queries enumerate authored records without inferring the other relation kind.
    - No participant revision, disposition or canonical topology changes; cross-kind endpoints fail closed.
  - name: Retired subject
    given: An explicitly retired Requirement with retained revision history.
    when: Exact lookup and dependency evaluation are requested.
    then:
    - Lookup resolves the retired identity and requested revision.
    - It cannot satisfy a Requirement dependency; graph topology follows the unchanged parent contract.
  - name: Workspace identity ambiguity
    given: Two independent forks declare the same immutable workspace identity.
    when: Their datasets are joined for lookup.
    then:
    - Return ambiguous_workspace_identity before selecting any subject.
    - Declared replicas of the same workspace retain identity; conflicting replica declarations also fail
      closed.
  - name: Exact lookup and legacy evidence
    given: An unavailable exact revision and legacy text with multiple criterion mappings.
    when: Read-only lookup or evidence resolution runs.
    then:
    - Return unavailable_revision or ambiguous_legacy_evidence_mapping respectively.
    - Do not return latest, a successor, matching text, or another workspace; do not allocate IDs.
  - name: Concurrent revision conflict
    given: Two transitions claim the same next revision of one subject.
    when: A governed revision is recorded.
    then:
    - The next revision and immediate predecessor are atomic and unique.
    - Conflicting successors fail closed as conflicting_revision_successor; previous history remains inspectable.
  - name: Exact content with current disposition
    given: Requirement REQ-0007 revision 2 is activated and later withdrawn without a content revision.
    when: Exact lookup of revision 2 is requested before and after withdrawal.
    then:
    - Selected content and revision-specific containment remain revision 2 in both results.
    - The explicitly labelled current_subject_disposition changes from active to retired and cites the
      observed disposition event.
    - Neither response claims the disposition as of content revision 2; historical as-of evaluation requires
      a separate contract.
