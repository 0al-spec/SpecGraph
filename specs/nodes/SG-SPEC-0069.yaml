acceptance:
- Defines a versioned workspace declaration and standalone Requirement and criterion record layout without
  creating a new seed kind or duplicate embedded Requirements.
- Defines retained revision records, exact acceptance references and independent disposition with guarded
  append-only writes.
- Defines review-only candidate envelopes and explicit canonical materialization prerequisites without
  treating preparation or historical tests as adoption.
