  objective: Propose the smallest source-controlled storage contract that can materialize the two repaired-candidate
    Requirements and their four acceptance criteria after review.
  adoption_boundary:
    state: human_approved
    proposal: '0221'
    preparation_authorization:
      source: Current Codex task conversation, user instruction on 2026-10-02
      source_quote: Отлично, давай делай.
      scope: Prepare this child storage contract and two Requirement candidates with a 3 plus 1 criterion
        partition.
