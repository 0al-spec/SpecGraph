prompt: Maintain the human-approved SG-SPEC-0069 version-1 physical contract and exact 3 plus 1 mapping.
  Implement and verify the bounded read-only source adapter, then a validating origin/content-revision
  writer. Canonical materialization and evidence applicability need separate decisions. Preserve frozen
  SG-SPEC-0019 and historical pilot/preparation evidence.
