apiVersion: ontology.specgraph.io/v1alpha1
kind: DomainOntologyPackage
metadata:
  id: org.0al.specgraph.intent-proposal
  namespace: sgproposal
  version: 0.5.0-draft.1
  publisher: SpecGraph
  source: specs/models/SG-SPEC-0053/intent-to-proposal/versions/0.5.0-draft.1/domain-ontology-package.yaml
  approvalStatus: draft
spec:
  imports:
    - {id: ontology.foundation, namespace: ont, version: 0.2.0}
    - {id: specgraph.foundation, namespace: sg, version: 0.1.0}
    - {id: org.0al.specgraph.core, namespace: sgcore, version: 0.4.0}
  classes:
    RawInput:
      extends: ont:DomainEntity
      description: Source input from which one or more partial intent signals may be extracted.
    IntentSynthesizer:
      extends: ont:DomainEntity
      description: A person or agent acting to synthesize fragments into a candidate draft in this interpretation.
    ProposalAuthor:
      extends: ont:DomainEntity
      description: A person or agent acting as the author of a candidate proposal in this interpretation.
    InterpretIntentForProposal:
      extends: ont:Action
      description: Interpret an intent in the context of an existing candidate proposal.
      fields:
        candidateProposal:
          type: ref
          target: sgcore:Proposal
          required: true
          description: The candidate for which the intent is interpreted; the application resolves this reference.
    InterpretFragmentForDraft:
      extends: ont:Action
      description: Interpret a fragment in the context of an existing candidate intent draft.
      fields:
        candidateDraft:
          type: ref
          target: sgcore:IntentDraft
          required: true
          description: The candidate draft for which the fragment is interpreted; the application resolves this reference.
  relations:
    rawInputSourceForFragment:
      domain: RawInput
      range: sgcore:IntentFragment
      description: A raw input supplies source material for an extracted fragment.
    interpretsFragmentForDraft:
      subject: IntentSynthesizer
      action: InterpretFragmentForDraft
      object: sgcore:IntentFragment
      description: A synthesizer interprets a fragment while developing the draft identified by the action.
    interpretsIntentForProposal:
      subject: ProposalAuthor
      action: InterpretIntentForProposal
      object: sgcore:Intent
      description: An author interprets an intent while developing the candidate identified by the action.
