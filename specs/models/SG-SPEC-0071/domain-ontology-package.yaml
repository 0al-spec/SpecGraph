apiVersion: ontology.specgraph.io/v1alpha1
kind: DomainOntologyPackage
metadata:
  id: org.0al.specgraph.local.payloadcheck
  namespace: payload
  version: 0.2.0
  approvalStatus: draft
spec:
  imports:
    - {id: specgraph.foundation, namespace: sg, version: 0.1.0}
    - {id: org.0al.specgraph.core, namespace: sgcore, version: 0.1.0}
  classes:
    ManifestEntry:
      extends: sg:ValueObject
      description: A path and the SHA-256 declared for that file in the expected bundle manifest.
      fields:
        path: {type: string, required: true}
        expectedSHA256: {type: string, required: true}
    LocalManifest:
      extends: sg:ValueObject
      description: The exact local manifest file whose bytes supply the expected SHA-256.
      fields:
        path: {type: string, required: true}
        expectedSHA256: {type: string, required: true}
    FetchedFileObservation:
      extends: sgcore:Evidence
      description: The SHA-256 of bytes returned for the selected file.
      fields:
        observedSHA256: {type: string, required: true}
  relations:
    comparedAgainst:
      domain: FetchedFileObservation
      range:
        oneOf: [ManifestEntry, LocalManifest]
      cardinality: {min: 1, max: 1}
      description: Identifies the source of the expected digest for this observation.
