[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specgraph"
dynamic = ["version"]
description = "SpecGraph tools: portable SpecDraft notes and local preview"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SpecGraph" }]
dependencies = [
    "pyyaml==6.0.3",
    "specification-core @ git+https://github.com/SoundBlaster/SpycificationCore.git@6113d773e78cb94c4eb0ce31e8439877fef45494",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.9"]

[project.scripts]
specgraph = "specgraph.cli:main"

[tool.setuptools]
packages = ["specgraph", "conversation_notes", "specdraft_preview"]
py-modules = ["conversation_notes_cli", "specdraft_preview_cli"]

[tool.setuptools.package-dir]
"" = "tools"
specgraph = "src/specgraph"

[tool.setuptools.dynamic]
version = {attr = "specgraph.__version__"}

[tool.setuptools.package-data]
specgraph = [
    "resources/skills/specgraph-conversation-notes/SKILL.md",
    "resources/skills/specgraph-conversation-notes/references/*.md",
]
specdraft_preview = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tools", "tests"]
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
