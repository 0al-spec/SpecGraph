id: DRAFT-SPEC-0223
title: SpecGraph - Native BDD Scenario Declaration Contract Preparation
kind: spec
status: outlined
maturity: 0.15
depends_on: []
refines:
- SG-SPEC-0062
inputs:
- docs/proposals/0223_bdd_scenario_contract_and_gherkin_exchange.md
- docs/reviews/0223_zeusus_bdd_observation.json
- docs/schema/node-format.md
