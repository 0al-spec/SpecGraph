acceptance:
- Defines explicit project ontology context selection for one package or a composed set with exact pins
  and explicit dependency and name-resolution rules.
- Binds a stable immutable context revision to the resolved package set, dependency closure, source and
  IR hashes, compiler identity, and checking profiles for one operation.
- Distinguishes verified, unavailable, and invalid outcomes with declared check scope, concrete diagnostics,
  and no substitution of old IR as current verified context.
- Keeps SG-RFC-0232 selection semantics source-attributed and separate from semantic approval,
  complete terminology coverage, and runtime enforcement.
