acceptance:
- A proposed authored traceability obligation identifies its retained source intent or authoring request;
  inferred requirements and engineering choices are labeled separately, and an unresolved source cannot
  be presented as a canonical derivation.
- Each authored observation obligation retains the specification, rule, component and implementation attribution
  requested for that target, independently of sibling obligations. A complete sibling or root summary
  cannot supply an omitted declaration.
- Refinement and projection preserve the selected authoring requirements and expose omission or ambiguous
  renaming for review; executor edits do not silently remove a requested traceability obligation. This
  does not mandate a global profile.
- An authored mapping declares the rule scope it intends to cover and whether coverage is full or partial.
  Reference validity and coverage are distinct; a full-scope claim identifies uncovered rules by exact
  identity. Root delegation does not require copied participant rules; many-to-many mappings remain possible.
- A scenario attribution is conditional on an actual harness binding. Ordinary runtime observations without
  a tagged harness do not receive fabricated scenario identities; declarations and test references do
  not establish test execution.
- Successful authored-declaration checks establish only their declared structural scope. They do not establish
  actual runtime propagation, implementation conformance, executed or passing tests, evidence admission,
  or canonical approval. Diagnostic collection must not alter product behavior.
acceptance_evidence: []
