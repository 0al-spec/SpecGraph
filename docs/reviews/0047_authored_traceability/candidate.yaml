prompt: Prepare one review-only declaration contract grounded in the recorded human intent and retained
  Zeusus authoring feedback. Preserve source requirements separately from engineering decisions; do not
  adopt canonical policy. This corrected seed groups six proposed requirements into four acceptance criteria;
  the original failed input and run remain retained.
specification:
  objective: Preserve the requested intent-to-rule-to-implementation/test/runtime attribution when authoring
    and projecting observation declarations, with explicit mapping scope and honest evidence strength.
  preparation_only: true
  source_proposal: '0047'
  proposed_canonical_parent: SG-SPEC-0062
  source_intent_capture: docs/reviews/0047_authored_traceability/intent.json
  scope:
    in:
    - Authored observation identity attribution requested by an explicit target
    - Source-bound requirements distinct from proposed engineering choices
    - Explicit rule mapping scope and declaration-level coverage
    - Conditional harness attribution and non-interference
    out:
    - New canonical node or edge kinds
    - Universal runtime event schema or mandatory product field spellings
    - SDK propagation, instrumentation transport, storage or metrics
    - Code/test/runtime conformance and evidence admission
    - Canonical adoption or profile activation
    - Rewriting frozen SG-SPEC-0017, SG-SPEC-0020 or parent specs
  requirements:
  - id: ATC-REQ-001
    title: Source intent remains explicit
    statement: A proposed authored traceability obligation identifies its retained source intent or authoring
      request; inferred requirements and engineering choices are labeled separately, and an unresolved
      source cannot be presented as a canonical derivation.
    authority: proposed_requirement_not_canonical
    source_refs:
    - INTENT-0047-DERIVATION
    - INTENT-0047-ADDRESSABILITY
  - id: ATC-REQ-002
    title: Each obligation retains requested identity
    statement: Each authored observation obligation retains the specification, rule, component and implementation
      attribution requested for that target, independently of sibling obligations. A complete sibling
      or root summary cannot supply an omitted declaration.
    authority: proposed_requirement_not_canonical
    source_refs:
    - INTENT-0047-ADDRESSABILITY
    - ZEU-AUTHORING-0047-01
    - ZEU-AUTHORING-0047-02
    - ZST-04
  - id: ATC-REQ-003
    title: Authoring preserves requested meaning
    statement: Refinement and projection preserve the selected authoring requirements and expose omission
      or ambiguous renaming for review; executor edits do not silently remove a requested traceability
      obligation. This does not mandate a global profile.
    authority: proposed_requirement_not_canonical
    source_refs:
    - INTENT-0047-ADDRESSABILITY
    - INTENT-0047-DERIVATION
    - ZEU-AUTHORING-0047-02
    - ZST-04
  - id: ATC-REQ-004
    title: Mapping scope and coverage are explicit
    statement: An authored mapping makes its intended rule scope and any omitted coverage explicit. Reference
      validity and coverage are distinct; a claim to cover the declared scope identifies uncovered rules
      by exact identity. Root delegation does not require copied participant rules; many-to-many mappings
      remain possible.
    authority: proposed_requirement_not_canonical
    source_refs:
    - INTENT-0047-DELIVERY-CHAIN
    - ZEU-AUTHORING-0047-02
    - ZST-02
  - id: ATC-REQ-005
    title: Scenario attribution requires a real harness
    statement: A scenario attribution is conditional on an actual harness binding. Ordinary runtime observations
      without a tagged harness do not receive fabricated scenario identities; declarations and test references
      do not establish test execution.
    authority: proposed_requirement_not_canonical
    source_refs:
    - INTENT-0047-DELIVERY-CHAIN
    - ZEU-AUTHORING-0047-01
    - ZEU-AUTHORING-0047-02
  - id: ATC-REQ-006
    title: Declaration checks retain evidence boundaries
    statement: Successful authored-declaration checks establish only their declared structural scope.
      They do not establish actual runtime propagation, implementation conformance, executed or passing
      tests, evidence admission, or canonical approval. Diagnostic collection must not alter product behavior.
    authority: proposed_requirement_not_canonical
    source_refs:
    - INTENT-0047-DELIVERY-CHAIN
    - ZEU-AUTHORING-0047-01
  engineering_choice_boundary:
    profile: observability_identity_declarations_v1 is a proposed concrete realization, not the human
      intent itself.
    choices:
    - Exact five field names are the selected Zeusus-compatible profile vocabulary, not universal ontology.
    - Explicit opt-in, immutable selector, SHA-256 pins and diagnostic statuses are proposed implementation
      choices.
    - Empty alias map and CLI exit-code mapping are proposed compatibility choices.
    alternatives_allowed: An alternative realization may satisfy the same reviewed requirements if it
      preserves attributable meaning and makes omissions visible.
    conditional_scenario: Required scenario_id_if_tagged declaration in the proposed profile does not
      require an emitted runtime ID without a tagged harness.
