    - When its declaration is refined or projected
    - Then An authored mapping makes its intended rule scope and any omitted coverage explicit. Reference
      validity and coverage are distinct; a claim to cover the declared scope identifies uncovered rules
      by exact identity. Root delegation does not require copied participant rules; many-to-many mappings
      remain possible.
  - id: ATC-SCENARIO-005
    scenario: Scenario attribution requires a real harness
    steps:
    - Given the source-bound authored traceability requirement ATC-REQ-005
    - When its declaration is refined or projected
    - Then A scenario attribution is conditional on an actual harness binding. Ordinary runtime observations
      without a tagged harness do not receive fabricated scenario identities; declarations and test references
      do not establish test execution.
  - id: ATC-SCENARIO-006
    scenario: Declaration checks retain evidence boundaries
