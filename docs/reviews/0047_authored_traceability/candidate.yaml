acceptance:
- Retains explicit source intent for each proposed requirement and distinguishes requested observation
  attribution from profile engineering choices.
- Defines per-obligation preservation of requested identity and authoring context so sibling declarations
  or candidate edits cannot silently satisfy omitted obligations.
- Defines explicit rule mapping scope and distinguishes exact reference validity from full or partial
  coverage without duplicating delegated rules.
- Preserves harness-only scenario attribution, diagnostic non-interference and the distinction between
  authored declarations and executed or admitted evidence.
