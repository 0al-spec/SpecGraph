  mapping_rules:
  - Preserve all four pilot records, full source references, their authored revision origins, and the
    historical checkpoint report unchanged.
  - A destination in another workspace is a distinct identity even when its local ID and statement are
    preserved. Record a reviewed source-to-destination mapping; do not encode it as a same-identity predecessor,
    relocation, replacement, or topology supersession by implication.
  - Proposed destination revision 1 begins only at explicit adoption. It has no same-identity predecessor
    and must not be backdated to the historical Git commits.
  - Destination acceptance_criteria_refs must pin full exact criterion references in each Requirement
    revision; prose lists and evidence text do not substitute for authored references.
  - Tests at pinned historical commits remain evidence for their source pilot references. Review may author
    explicit applicability links to destination refs without relabelling the original executions or claiming
    trusted runtime receipts.
  - A Requirement is a canonical kind requirement node, not a duplicate embedded Requirement record inside
    a kind spec node. This temporary spec describes proposed nodes without materializing them.
  - Neither review readiness, successful tests, a merge, nor a source-to-destination mapping grants separate
    Platform promotion approval.
  adoption_decisions_required:
  - Human approval of the two Requirement statements and the 3-plus-1 criterion membership partition.
  - Explicit human approval of the canonical workspace declaration and local subject ID/storage conventions
    proposed here; SG-SPEC-0068 deferred these physical decisions.
  - Reviewed mapping records containing source occurrence, full exact source and destination references,
    reviewer identity/authority, decision time, outcome, rationale, and provenance.
  - A supported writer and validated canonical storage shape before materialization; the existing subject_read_snapshot
    is an exchange format, not an adopted storage schema.
  - A source-controlled transition record for SpecDraft-to-canonical materialization under SG-SPEC-0051,
    with no invented approval record.
  preparation_exclusions:
  - No new canonical nodes, workspace declarations, revisions, adoption events, or promotion approval.
  - No history reconstruction, graph parent edits, approval-boundary changes, or inferred readiness.
  - No new runtime or migration writer in this preparation pass.
