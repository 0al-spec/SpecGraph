acceptance:
- Maps all four exact pilot criterion references to two proposed canonical Requirement concerns without
  conflating review readiness with promotion approval.
- Separates an explicit reviewed namespace mapping from same-identity revision history and preserves historical
  evidence attribution.
- Defines concrete proposed Requirement nodes and criterion destinations with adoption decisions and storage
  gaps explicit.
- Keeps canonical adoption, readiness evaluation, existing graph nodes, runtime behavior, and approval
  authority unchanged during preparation.
acceptance_evidence:
- criterion: Maps all four exact pilot criterion references to two proposed canonical Requirement concerns
    without conflating review readiness with promotion approval.
  evidence: specification.proposed_requirements partitions ac.clean-noop, ac.repaired-preview, and ac.unresolved-gaps
    under review readiness and ac.approval-boundary under separate promotion approval. specification.criterion_mapping
    retains all four source revision-1 references and proposed destination references; these are proposed
    links, not adopted nodes.
- criterion: Separates an explicit reviewed namespace mapping from same-identity revision history and
    preserves historical evidence attribution.
  evidence: specification.mapping_rules states that another workspace produces a distinct identity, forbids
    an implied same-identity predecessor, dates destination revision 1 at adoption, and retains original
    historical execution attribution.
- criterion: Defines concrete proposed Requirement nodes and criterion destinations with adoption decisions
    and storage gaps explicit.
  evidence: specification.proposed_requirements defines two kind requirement candidates, while specification.proposed_workspace
    and specification.adoption_decisions_required identify proposed physical conventions, required review
    provenance, and the missing validating writer. No Requirement subject snapshot with fabricated canonical
    presence is constructed.
- criterion: Keeps canonical adoption, readiness evaluation, existing graph nodes, runtime behavior, and
    approval authority unchanged during preparation.
  evidence: specification.review_status is not_adopted, canonical_mutations_allowed is false, and canonical_readiness
    is not_evaluated. specification.preparation_exclusions forbids graph edits, runtime code, adoption
    events, and promotion approval.
prompt: Refine only this temporary review draft for RFC0221. Prepare a reviewable mapping for the four
  pilot criteria. The temporary DRAFT ID and all proposed destination IDs are review labels, not canonical
  reservations. Read source proposals, the pilot plan, and SG-SPEC-0068. Preserve criterion wording, distinguish
  all identity and evidence roles, and surface unsupported schema choices. Do not change any other file
  or allocate canonical subjects.
