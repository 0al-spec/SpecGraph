    spec_id: SG-SPEC-0069
    path: specs/nodes/SG-SPEC-0069.yaml
    schema_version: 1
    governing_specs:
    - SG-SPEC-0001
    - SG-SPEC-0019
    - SG-SPEC-0024
    - SG-SPEC-0051
    - SG-SPEC-0068
    storage_layout:
      schema_version: 1
      format: Strict YAML mappings with duplicate keys rejected and repository canonical formatting.
      workspace_declaration: specs/workspace_identity.yaml
      requirement_nodes: specs/requirements/<optional grouping directories>/<local_subject_id>.yaml; the
        first candidates use no grouping directory.
      criterion_records: specs/criteria/<optional grouping directories>/<local_subject_id>.yaml; the first
        candidates use no grouping directory.
      history_placement: Retained content revisions and disposition events are inline in each subject
        record; no separate mutable current-content file is authoritative.
      local_id_convention: Case-sensitive ASCII IDs matching [A-Za-z0-9][A-Za-z0-9._-]*, excluding the
        exact names dot and dot-dot. References retain exact spelling; portable allocation checks are
        separate from logical identity.
      portable_namespace:
        collision_key: ASCII lowercase of local_subject_id
        scope: Entire declared workspace, across Requirement and criterion classes, grouping directories,
          retained history and active or retired disposition.
        conflict_action: Reject distinct exact IDs with the same collision key before allocation or publication
          and during whole-tree source validation; never coalesce, rename or overwrite them.
        grouping_directories: Optional grouping components use lowercase ASCII matching [a-z0-9][a-z0-9._-]*;
          dot and dot-dot are forbidden. Grouping does not create another identity namespace.
        examples:
        - local_ids:
          - REQ.A
          - req.a
          outcome: reject_portable_collision
        - local_ids:
          - req.a
          - ac.a
          outcome: no_portable_collision
      namespace: All Requirement and criterion local IDs share one workspace-local namespace. The req.
        and ac. prefixes are conventions, not separate collision scopes.
      workspace_identity_convention: workspace:<lowercase UUID>; the reviewed declaration is persisted
        once and retained by replicas. A directory, repository remote or Git commit does not declare identity.
      allocation: Explicit reviewed allocation only. Ordinary reads and validation allocate nothing. The
        workspace UUID and local IDs in the examples are unreserved review tokens.
      dataset_binding: A canonical-source adapter receives an explicit selected source root and dataset_identity.
        Dataset binding is preserved when exporting a read snapshot; it is not derived from a mutable
        repository name.
    document_shapes:
      workspace_declaration:
        artifact_kind: subject_workspace_declaration
        required_fields:
        - schema_version
        - artifact_kind
        - workspace_identity
        - provenance
        provenance: Required non-empty reference to the genuine workspace declaration decision; a preparation
          reference does not authorize allocation.
      requirement_node:
        artifact_kind: requirement_node
        required_fields:
        - schema_version
        - artifact_kind
        - id
        - title
        - kind
        - status
        - authority_class
        - source_ref
        - provenance
        - subject
        - current_revision
        - revisions
        - current_disposition
        - retained_disposition_transitions
        invariants:
        - kind is requirement; subject.subject_class is Requirement; id equals subject.local_subject_id.
        - subject.workspace_identity equals the selected workspace declaration.
        - The required SG-SPEC-0001 node fields and SG-SPEC-0024 provenance envelope are preserved. Current
          title, status, authority_class, source_ref and provenance must equal the selected revision node_fields
          projection.
        - This node owns its revision-specific acceptance_criteria_refs; it is not embedded in a kind
          spec node.
      node_provenance:
        governing_contract: SG-SPEC-0024
        required_fields:
        - actor_id
        - authority_class
        - recorded_at
        optional_fields:
        - source_ref
        - source_system
        - source_confidence
        - notes
        - trace_context
        conditional_required_fields:
          imported:
          - source_ref
          inferred:
          - source_ref
          - source_confidence
        authority_classes:
        - authored
        - imported
        - inferred
        - distilled
        source_confidence_values:
        - low
        - medium
        - high
        rules:
        - actor_id is non-empty and recorded_at is a timestamp attributable to the actual creation or
          update.
        - authority_class and any source_ref agree with the enclosing Requirement node metadata.
        - imported and inferred source_ref is a stable deterministic pointer to the actual triggering
          artifact; inferred source_confidence is one of the declared bounded values.
        - Unknown envelope fields fail closed. Optional metadata remains representable, subject to the
          declared conditional requirements.
        - Every Requirement revision retains its full node provenance envelope in node_fields.provenance;
          actor attribution and recorded_at reflect that revision. Earlier envelopes remain unchanged.
        - This structured node envelope is distinct from the governed decision reference in revision.provenance.
      criterion_record:
        artifact_kind: acceptance_criterion_record
        required_fields:
        - schema_version
        - artifact_kind
        - id
        - title
        - subject
        - current_revision
        - revisions
        - current_disposition
        - retained_disposition_transitions
        invariants:
        - subject.subject_class is criterion; id equals subject.local_subject_id; workspace matches the
          declaration.
        - There is no kind criterion seed node declaration. The current title equals the selected revision
          node_fields.title projection.
        - Every criterion revision has an empty acceptance_criteria_refs collection.
      revision:
        required_fields:
        - number
        - predecessor
        - node_fields
        - statement
        - containment
        - provenance
        - revision_scope
        - acceptance_criteria_refs
        node_fields: Requirement revisions retain title, status, authority_class, source_ref and the full
          node_provenance envelope as provenance; criterion revisions retain title. These retained values
          distinguish historical node metadata from the current projection.
        statement: Required non-empty normative statement; criterion wording is retained verbatim from
          the reviewed mapping.
        containment: Source-root-relative canonical file path at that revision, not identity or ownership.
        provenance: Required non-empty governed revision decision reference. Revision-1 provenance cites
          the actual SpecDraft-to-canonical materialization record, never a historical test or Git checkpoint.
        revision_scope: Required non-empty authored bounded change summary in every Requirement and criterion
          revision, including the origin; retained unchanged with that revision. The summary identifies
          affected semantic surfaces and is not reconstructed from a storage diff, statement or predecessor.
      current_disposition:
        required_fields:
        - state
        - basis_ref
        - observation_provenance
        rules:
        - state is active or retired and is explicitly a current projection.
        - basis_ref resolves to the last retained activation or withdrawal event in authored order, with
          genuine decision provenance; the projection must agree with that event, never an older activation.
        - Selecting an old content revision does not imply disposition as of that revision.
      disposition_event:
        required_fields:
        - event_ref
        - transition
        - provenance
        transition_values:
        - activation
        - withdrawal
        rules:
        - event_ref is unique within the subject record; transition is activation or withdrawal; provenance
          is a genuine governed decision reference.
        - Events are appended and retained in authored order; previous events cannot be removed, edited
          or reordered. Content revisions and disposition events are independent.
      reference:
        shape: subject with workspace_identity, subject_class and local_subject_id, plus mode exact and
          a positive integer revision.
        compatibility: Uses the existing typed RevisionSelection shape; current selection is forbidden
          in Requirement acceptance membership.
      canonical_presence:
        rule: The source adapter derives Requirement canonical_presence from the explicitly selected canonical
          topology and its governance evidence, not from file existence, current_disposition or artifact_kind.
          Canonical presence is not an author-writable field in these documents.
    revision_storage:
      rules:
      - Each adopted subject starts at revision 1 with predecessor null. Revision numbers are positive
        integers, never booleans.
      - Each later revision is the next integer with the immediately preceding same-identity revision
        number as predecessor. Retained earlier records cannot be removed, replaced or reworded.
      - current_revision names the last retained content revision. Physical list order is not identity;
        readers validate a complete contiguous chain by revision number.
      - Adding, removing or repinning a Requirement acceptance reference creates a new Requirement revision.
        Referenced criterion revisions must resolve exactly in the selected declared source scope.
      - A containment move creates the next subject revision and retains earlier containment. Requirement
        membership does not change merely because a criterion moves.
      - Lifecycle/status changes follow existing governance and are retained in revision node_fields when
        authored; title projections are not a second content authority.
      - Retirement appends a disposition event and updates its labelled current projection without changing
        content history. Successful historical lookup does not make a retired Requirement ready.
    write_contract:
      rules:
      - Only an explicitly authorized writer may allocate identities or materialize canonical source files.
        Files in docs/reviews are never scanned as canonical storage.
      - Before writing, validate the workspace declaration, exact shared namespace and portable collision
        keys, full references, node kind, schema fields, SG-SPEC-0024 node provenance, authored revision_scope,
        history continuity, current projections and exact criterion pins. Unknown fields and unsupported
        versions fail closed. Whole-tree validation applies the portable namespace rule even on a case-sensitive
        host before accepting source trees authored elsewhere.
      - Storage paths remain within the selected source root, with no traversal or symlink escape. Current
        containment matches the physical record path. Grouping directories may change only through an
        explicit containment_move; the filename preserves the local subject ID.
      - Require an expected prior source digest for updates and a no-existing-subject precondition for
        origins. Conflicting next revisions or concurrent allocations fail closed; do not overwrite another
        writer's result.
      - Prepare all affected records in one isolated candidate tree and validate it before publication.
        A Requirement and newly referenced criterion origins, or both Requirements in a membership transfer,
        publish atomically as one source-controlled change.
      - Keep failed or partial writes outside the selected canonical source. An artifact or file on disk
        does not prove readiness, adoption or approval.
      - The first writer may support origins and revisions only; it must reject unsupported relation,
        topology or migration operations rather than silently omit their history.
