atoms:
  intents:
  - id: GRAPH-BEFORE-IMPLEMENTATION
    statement: Begin product implementation and its pilots only when the specification graph covers the agreed scope and each branch reaches a leaf with defined behavior, explicit acceptance criteria, and the upstream decisions that can change it resolved.
  - id: LEAF-FIRST-COMPOSITION
    statement: Implement leaf specifications first in composable modules that follow the project's specified architecture, then compose those modules to fulfill parent specifications.
