provenance:
  authored_by: agent
  authority: proposal_draft
  source_ref: docs/archive/proposal_sources/0045_conversation_memory_exploration_vault.md
atoms:
  intents:
  - id: CN-CAPTURE
    statement: The agent can save a short note during a conversation before choosing its semantic kind.
  - id: CN-RESUME
    statement: A later session can recover the saved sketch with its hierarchy, stable addresses and source quotations.
  - id: CN-REFINE
    statement: Renaming and regrouping notes preserve their identities and original source quotations.
  - id: CN-ATTRIBUTION
    statement: Human quotations and agent interpretations remain attributable and distinguishable.
  - id: CN-DIFF
    statement: The review diff reflects stored structural and attribution changes; unchanged edits preserve the revision.
  - id: CN-APPROVAL-SCOPE
    statement: Whole-sketch approval, authorization to prepare a proposal and canonical acceptance retain their respective subjects.
  - id: CN-HANDOFF
    statement: Selected conversation notes can inform a bounded proposal naming the existing specification region and intended change.
  - id: CN-PROMOTION
    statement: Applying a proposed graph change follows the existing recorded promotion and review boundaries.
